<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms of service — Paperleaf</title>
    <meta name="description" content="Terms of service for Paperleaf — private native invoicing for Mac and Windows." />
    <meta property="og:title" content="Terms of service — Paperleaf" />
    <meta property="og:description" content="Terms of service for Paperleaf — private native invoicing for Mac and Windows." />
    <meta property="og:image" content="./renders/social.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <!-- Set theme before paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mu-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/terms-main.tsx"></script>
  </body>
</html>
